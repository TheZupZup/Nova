# Nova — full Docker Compose stack (self-hosted / local).
#
# Runs everything Nova needs in containers: the Nova web app and a local
# Ollama model server. No Python, Ollama, or dependencies are installed on
# the host. There is no cloud component and no remote sync.
#
# Quick start (build from source — the default developer workflow):
#   docker compose up -d
#   open http://localhost:8000
#
# That's the whole setup — no file copying, no manual steps. The stack
# comes up with safe defaults (admin login: admin / changeme). To change
# credentials, ports, or enable integrations, copy the sample env file
# and edit it first (entirely optional):
#   cp .env.example .env      # optional — only to override the defaults
#
# Don't want to build? Deploy the prebuilt image from GHCR instead with
# docker-compose.ghcr.yml (no checkout/build needed):
#   docker compose -f docker-compose.ghcr.yml up -d
#
# See docs/docker.md for the full guide (first-run, updates, backups,
# pulling models, GPU, Windows browser access).

services:
  # ── Nova web application ──────────────────────────────────────────
  nova:
    # Build the image from this checkout (the default developer workflow).
    #
    # Prefer a prebuilt image and skip building entirely? Use the GHCR
    # stack instead — it pulls ghcr.io/thezupzup/nova:latest:
    #   docker compose -f docker-compose.ghcr.yml up -d
    # (see docker-compose.ghcr.yml and docs/docker.md).
    build:
      context: .
    image: nova:local
    container_name: nova
    restart: unless-stopped

    # Load overrides from .env WHEN PRESENT. `required: false` keeps a
    # fresh clone working with zero setup: with no .env the container falls
    # back to the defaults in `environment:` below (which always win over
    # the env file, so the in-container paths/URLs stay correct).
    # Needs Docker Compose v2.24+ (Docker Desktop / Engine shipped it in
    # early 2024); upgrade Docker if you see an "unexpected key" error here.
    env_file:
      - path: .env
        required: false
    environment:
      # Persist all runtime state on the /data volume (mounted below).
      NOVA_DATA_DIR: /data
      # Reach the bundled Ollama container over the compose network.
      # Override OLLAMA_HOST in .env to point at an external Ollama
      # (e.g. http://192.168.1.50:11434) and Nova will use that instead.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Port uvicorn binds inside the container.
      NOVA_PORT: ${NOVA_PORT:-8000}
      # First-run admin account. These defaults let the stack come up with
      # zero configuration; the app seeds this login into the database on
      # the very first start. CHANGE THEM in .env (or your shell) BEFORE
      # exposing Nova beyond localhost — the defaults are deliberately weak.
      NOVA_USERNAME: ${NOVA_USERNAME:-admin}
      NOVA_PASSWORD: ${NOVA_PASSWORD:-changeme}

    ports:
      # host:container. Reach Nova at http://localhost:8000 and, from
      # other LAN machines, http://<host-ip>:8000. Change the host side
      # with NOVA_HOST_PORT in .env if 8000 is already taken.
      - "${NOVA_HOST_PORT:-8000}:${NOVA_PORT:-8000}"

    volumes:
      # Persistent app data: nova.db (database + memory + settings +
      # conversations) plus backups/, exports/, memory-packs/, logs/ and
      # the auto-generated secret_key. Survives `docker compose down` and
      # rebuilds; removed only by `docker compose down -v`.
      - nova-data:/data

    depends_on:
      ollama:
        condition: service_healthy

  # ── Ollama local model server ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nova-ollama
    restart: unless-stopped

    volumes:
      # Pulled models + manifests live here, NOT in the container layer,
      # so they survive image updates and `docker compose down`.
      - ollama-models:/root/.ollama

    # Ollama is reached by Nova over the internal compose network and does
    # not need to be published to the host. Uncomment to also expose the
    # API on the host (e.g. to run `ollama` commands from the host or share
    # the model server with other machines):
    # ports:
    #   - "11434:11434"

    healthcheck:
      # `ollama list` returns 0 once the daemon is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ── Optional NVIDIA GPU acceleration ─────────────────────────────
    # Requires the NVIDIA driver + nvidia-container-toolkit on the host.
    # Uncomment the block below, then `docker compose up -d`. CPU-only
    # works out of the box without this. See docs/docker.md (GPU section).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  nova-data:
  ollama-models:
