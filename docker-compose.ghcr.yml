# Nova — prebuilt-image Docker Compose stack (GHCR).
#
# Same stack as docker-compose.yml, but instead of building Nova from a
# local checkout this pulls the published image from the GitHub Container
# Registry. Use it to *deploy* Nova without cloning or building the whole
# repository.
#
# Quick start (no `git clone` required — just this one file):
#   docker compose -f docker-compose.ghcr.yml up -d
#   open http://localhost:8000
#
# Comes up with safe defaults (admin login: admin / changeme) and needs no
# manual setup. Drop an .env next to this file to override credentials,
# ports, or the image tag (NOVA_IMAGE_TAG).
#
# Update to the newest published image:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Your data and models live in named volumes and are NOT touched by an
# image update. See docs/docker.md for the full guide (first-run, updates,
# backups, pulling models, GPU, Windows browser access).

services:
  # ── Nova web application (prebuilt image) ─────────────────────────
  nova:
    # Pull the published image instead of building from source. Pin a
    # specific release by setting NOVA_IMAGE_TAG in .env (e.g.
    # NOVA_IMAGE_TAG=1.2.3); the default `latest` tracks the main branch.
    image: ghcr.io/thezupzup/nova:${NOVA_IMAGE_TAG:-latest}
    container_name: nova
    restart: unless-stopped

    # Load overrides from .env WHEN PRESENT. `required: false` keeps the
    # stack working with zero setup: with no .env the container falls back
    # to the defaults in `environment:` below (which always win over the
    # env file, so the in-container paths/URLs stay correct).
    # Needs Docker Compose v2.24+ (Docker Desktop / Engine shipped it in
    # early 2024); upgrade Docker if you see an "unexpected key" error here.
    env_file:
      - path: .env
        required: false
    environment:
      # Persist all runtime state on the /data volume (mounted below).
      NOVA_DATA_DIR: /data
      # Reach the bundled Ollama container over the compose network.
      # Override OLLAMA_HOST in .env to point at an external Ollama
      # (e.g. http://192.168.1.50:11434) and Nova will use that instead.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      # Port uvicorn binds inside the container.
      NOVA_PORT: ${NOVA_PORT:-8000}
      # First-run admin account. These defaults let the stack come up with
      # zero configuration; the app seeds this login into the database on
      # the very first start. CHANGE THEM in .env (or your shell) BEFORE
      # exposing Nova beyond localhost — the defaults are deliberately weak.
      NOVA_USERNAME: ${NOVA_USERNAME:-admin}
      NOVA_PASSWORD: ${NOVA_PASSWORD:-changeme}

    ports:
      # host:container. Reach Nova at http://localhost:8000 and, from
      # other LAN machines, http://<host-ip>:8000. Change the host side
      # with NOVA_HOST_PORT in .env if 8000 is already taken.
      - "${NOVA_HOST_PORT:-8000}:${NOVA_PORT:-8000}"

    volumes:
      # Persistent app data: nova.db (database + memory + settings +
      # conversations) plus backups/, exports/, memory-packs/, logs/ and
      # the auto-generated secret_key. Shares the same named volume as
      # docker-compose.yml, so switching between build and prebuilt keeps
      # your data. Removed only by `docker compose down -v`.
      - nova-data:/data

    depends_on:
      ollama:
        condition: service_healthy

  # ── Ollama local model server ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nova-ollama
    restart: unless-stopped

    volumes:
      # Pulled models + manifests live here, NOT in the container layer,
      # so they survive image updates and `docker compose down`.
      - ollama-models:/root/.ollama

    # Ollama is reached by Nova over the internal compose network and does
    # not need to be published to the host. Uncomment to also expose the
    # API on the host:
    # ports:
    #   - "11434:11434"

    healthcheck:
      # `ollama list` returns 0 once the daemon is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # ── Optional NVIDIA GPU acceleration ─────────────────────────────
    # Requires the NVIDIA driver + nvidia-container-toolkit on the host.
    # Uncomment the block below, then re-run `up -d`. CPU-only works out of
    # the box. See docs/docker.md (GPU section).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  nova-data:
  ollama-models:
